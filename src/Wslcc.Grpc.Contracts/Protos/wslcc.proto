syntax = "proto3";

option csharp_namespace = "Wslcc.Grpc.Contracts";

package wslcc.v1;

// The daemon-facing service consumed by the CLI (and, later, the GUI).
service Wslcc {
  // Fast readiness/liveness check that does not touch providers.
  rpc Ping (PingRequest) returns (PingResponse);

  // Returns the daemon build version and info for each registered provider.
  rpc GetVersion (GetVersionRequest) returns (GetVersionResponse);

  // Requests a graceful shutdown of the daemon (used by `wslcc daemon stop`).
  rpc Shutdown (ShutdownRequest) returns (ShutdownResponse);

  // Compose lifecycle.
  rpc Up (UpRequest) returns (UpResponse);
  rpc Down (DownRequest) returns (DownResponse);
  rpc Ps (PsRequest) returns (PsResponse);
  rpc Start (StartRequest) returns (StartResponse);
  rpc Stop (StopRequest) returns (StopResponse);
  rpc Restart (RestartRequest) returns (RestartResponse);
  rpc Pull (PullRequest) returns (PullResponse);
  rpc Build (BuildRequest) returns (BuildResponse);

  // Server-streaming: yields log lines as they are produced. When 'follow' is set the stream stays
  // open until the client cancels the call (e.g. Ctrl+C) or every container stops.
  rpc Logs (LogsRequest) returns (stream LogLine);
}

message PingRequest {}

message PingResponse {
  string daemon_version = 1;
  string default_provider = 2;
}

message GetVersionRequest {
  // Optional provider name; empty means "all registered providers".
  string provider = 1;
}

message ComponentVersion {
  string name = 1;
  string display_name = 2;
  bool available = 3;
  string version = 4;
  string details = 5;
}

message GetVersionResponse {
  string daemon_version = 1;
  repeated ComponentVersion providers = 2;
}

message ShutdownRequest {}

message ShutdownResponse {
  bool accepted = 1;
}

// Shared fields for identifying a project. The daemon resolves the effective project name as:
// explicit project_name, else the compose file's `name:`, else default_project_name.
message ServiceResult {
  string service = 1;
  string container_id = 2;
  string status = 3;
  string error = 4;
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
  string state = 4;
  string status = 5;
  string ports = 6;
  string service = 7;
  string project = 8;
}

// Controls whether `up` (re)builds services that declare a `build:` section.
enum BuildPolicy {
  // Build only when the target image is not present locally (default; matches `docker compose up`).
  BUILD_POLICY_AUTO = 0;
  // `--build`: always (re)build before starting.
  BUILD_POLICY_ALWAYS = 1;
  // `--no-build`: never build; fail if the image is missing.
  BUILD_POLICY_NEVER = 2;
}

message UpRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  bool pull = 5;
  // Absolute directory containing the compose file, used to resolve relative build contexts when a
  // service with a 'build:' section is auto-built because its image is missing.
  string base_directory = 6;
  // Whether a service's 'build:' section is (re)built on `up`.
  BuildPolicy build_policy = 7;
}

message UpResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message DownRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
}

message DownResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message PsRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  bool all = 5;
}

message PsResponse {
  string project_name = 1;
  repeated Container containers = 2;
}

message StartRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to start; empty means "every service with an existing container".
  repeated string services = 5;
}

message StartResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message StopRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to stop; empty means "every running service".
  repeated string services = 5;
}

message StopResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message RestartRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to restart; empty means "every service with an existing container".
  repeated string services = 5;
}

message RestartResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message PullRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to pull; empty means "every service with an image".
  repeated string services = 5;
}

message PullResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message BuildRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to build; empty means "every service with a 'build:' section".
  repeated string services = 5;
  // Absolute directory containing the compose file, used to resolve relative build contexts.
  string base_directory = 6;
}

message BuildResponse {
  string project_name = 1;
  repeated ServiceResult results = 2;
}

message LogsRequest {
  string project_name = 1;
  string default_project_name = 2;
  string compose_yaml = 3;
  string provider = 4;
  // Optional service names to show logs for; empty means "every existing container".
  repeated string services = 5;
  // Keep the stream open and yield new lines as they are written.
  bool follow = 6;
  // Number of lines to show from the end of the logs; unset means "all".
  optional int32 tail = 7;
  // Prefix each line with its timestamp. Also enables timestamp-ordered merging of a bounded
  // (non-follow) dump across containers.
  bool timestamps = 8;
  // Only show logs since this point: a duration (e.g. "10m", "1h30m") or an RFC3339 timestamp.
  // Empty means "no lower bound".
  string since = 9;
}

message LogLine {
  string service = 1;
  string line = 2;
  // RFC3339 timestamp of the line (UTC), when timestamps were requested; empty otherwise.
  string timestamp = 3;
}
