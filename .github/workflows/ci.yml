name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Wslcc.slnx

      - name: Build
        run: dotnet build Wslcc.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Wslcc.slnx --configuration Release --no-build --verbosity normal
